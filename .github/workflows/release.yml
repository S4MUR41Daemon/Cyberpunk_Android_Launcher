name: Release

# Al publicar un tag vX.Y.Z: compila la APK release firmada con la clave compartida y crea la Release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.ATMOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Falta el secreto ATMOS_KEYSTORE_BASE64: no se publica una APK con firma temporal."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/atmos-release.jks"
          echo "ATMOS_KEYSTORE_PATH=$RUNNER_TEMP/atmos-release.jks" >> "$GITHUB_ENV"

      - name: Test y compilación
        env:
          ATMOS_KEYSTORE_PASSWORD: ${{ secrets.ATMOS_KEYSTORE_PASSWORD }}
          ATMOS_KEY_ALIAS: ${{ secrets.ATMOS_KEY_ALIAS }}
          ATMOS_KEY_PASSWORD: ${{ secrets.ATMOS_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Preparar APK y notas
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/app-release.apk "ATMOS-OS-Launcher-${TAG}.apk"
          sed "s/{TAG}/${TAG}/g" .github/release-body.md > release-body.md
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ATMOS//OS Launcher ${{ env.TAG }}"
          body_path: release-body.md
          generate_release_notes: true
          files: "ATMOS-OS-Launcher-${{ env.TAG }}.apk"
