name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Bootstrap Gradle wrapper (if missing)
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

      - name: Decode signing key
        env:
          KS_B64: ${{ secrets.ATMOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/atmos-release.jks"
            echo "ATMOS_KEYSTORE_PATH=$RUNNER_TEMP/atmos-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto ATMOS_KEYSTORE_BASE64: la release se firma con una clave debug temporal."
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APKs (release optimizado + debug)
        env:
          ATMOS_KEYSTORE_PASSWORD: ${{ secrets.ATMOS_KEYSTORE_PASSWORD }}
          ATMOS_KEY_ALIAS: ${{ secrets.ATMOS_KEY_ALIAS }}
          ATMOS_KEY_PASSWORD: ${{ secrets.ATMOS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload release APK (recomendado, mucho más fluido)
        uses: actions/upload-artifact@v4
        with:
          name: atmos-launcher-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atmos-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
